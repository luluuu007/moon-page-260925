<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每晚 20:00 的月亮 · 位置与月相</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b31; --line:#263052;
    --txt:#e8ecf8; --sub:#8a94b8; --dim:#5a6488;
    --moon:#f2e9cf; --dark:#2a3352; --gold:#e8b04b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
  .wrap{width:100%;max-width:640px}
  h1{font-size:20px;font-weight:600;letter-spacing:.5px}
  .meta{color:var(--sub);font-size:12px;margin:4px 0 14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  svg{display:block;width:100%}
  .ctrl{display:flex;align-items:center;gap:10px;margin-top:4px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
         background:#1b2340;color:var(--txt);padding:6px 14px;font-size:13px}
  button:hover{border-color:var(--sub)}
  input[type=range]{flex:1;accent-color:var(--gold);height:24px}
  #dateLabel{font-size:16px;font-weight:600;min-width:64px;text-align:right;
             font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .stat .k{font-size:11px;color:var(--sub)}
  .stat .v{font-size:14px;font-weight:600;margin-top:2px;
           font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .stripLabel{font-size:12px;color:var(--sub);margin-bottom:6px}
  #strip{display:flex;gap:4px;overflow-x:auto;padding:4px 0 2px}
  #strip button{flex:0 0 auto;border:none;background:transparent;padding:3px;border-radius:9px}
  #strip button.on{box-shadow:0 0 0 1.5px var(--gold)}
  .note{color:var(--dim);font-size:12px;line-height:1.7;margin-top:14px}
  @media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>每晚 20:00，月亮在哪里、长什么样</h1>
  <div class="meta">2026 年 9 月 11 日新月 → 10 月 10 日新月 · 北纬 35° 示意模型 · 拖滑块或点连播</div>

  <div class="card">
    <svg id="sky" viewBox="0 0 360 300"></svg>
    <div class="ctrl">
      <button id="play">▶ 连播</button>
      <input id="sl" type="range" min="0" max="29" step="1" value="15">
      <div id="dateLabel"></div>
    </div>
  </div>

  <div class="card stats" id="stats"></div>

  <div class="card">
    <div class="stripLabel">一个月的月相（点击跳转）</div>
    <div id="strip"></div>
  </div>

  <div class="note">
    · 月球公转使月亮每天在星空中东移约 13°，月升平均推迟约 50 分钟，所以同一时刻看它一个月绕天一圈。<br>
    · 月升/月落为简化模型估算，与真实时刻可能相差十几分钟；月相与位置趋势准确。
  </div>
</div>

<script>
var MOON_DATA = [{"d":0,"date":"9月11日","alt":-21.1,"az":292.3,"illum":0,"E":0.0,"phase":"新月","rise":"06:00","set":"18:25"},{"d":1,"date":"9月12日","alt":-15.3,"az":281.0,"illum":1,"E":12.2,"phase":"蛾眉月（渐盈）","rise":"06:50","set":"19:15"},{"d":2,"date":"9月13日","alt":-9.0,"az":270.3,"illum":4,"E":24.4,"phase":"蛾眉月（渐盈）","rise":"07:40","set":"20:05"},{"d":3,"date":"9月14日","alt":-2.4,"az":260.0,"illum":10,"E":36.6,"phase":"蛾眉月（渐盈）","rise":"08:30","set":"20:55"},{"d":4,"date":"9月15日","alt":4.3,"az":249.8,"illum":17,"E":48.8,"phase":"蛾眉月（渐盈）","rise":"09:20","set":"21:45"},{"d":5,"date":"9月16日","alt":10.9,"az":239.5,"illum":26,"E":61.0,"phase":"蛾眉月（渐盈）","rise":"10:10","set":"22:35"},{"d":6,"date":"9月17日","alt":17.1,"az":228.7,"illum":35,"E":73.1,"phase":"蛾眉月（渐盈）","rise":"11:00","set":"23:25"},{"d":7,"date":"9月18日","alt":22.7,"az":217.1,"illum":46,"E":85.3,"phase":"上弦月","rise":"11:50","set":"00:15"},{"d":8,"date":"9月19日","alt":27.4,"az":204.7,"illum":57,"E":97.5,"phase":"盈凸月","rise":"12:40","set":"01:05"},{"d":9,"date":"9月20日","alt":30.9,"az":191.3,"illum":67,"E":109.7,"phase":"盈凸月","rise":"13:30","set":"01:55"},{"d":10,"date":"9月21日","alt":33.0,"az":177.2,"illum":76,"E":121.9,"phase":"盈凸月","rise":"14:20","set":"02:45"},{"d":11,"date":"9月22日","alt":33.4,"az":162.6,"illum":85,"E":134.1,"phase":"盈凸月","rise":"15:10","set":"03:35"},{"d":12,"date":"9月23日","alt":32.1,"az":148.2,"illum":92,"E":146.3,"phase":"盈凸月","rise":"16:00","set":"04:25"},{"d":13,"date":"9月24日","alt":29.2,"az":134.4,"illum":97,"E":158.5,"phase":"盈凸月","rise":"16:50","set":"05:15"},{"d":14,"date":"9月25日","alt":25.1,"az":121.5,"illum":99,"E":170.7,"phase":"盈凸月","rise":"17:40","set":"06:05"},{"d":15,"date":"9月26日","alt":19.9,"az":109.6,"illum":100,"E":182.8,"phase":"满月","rise":"18:30","set":"06:55"},{"d":16,"date":"9月27日","alt":13.9,"az":98.4,"illum":98,"E":195.0,"phase":"亏凸月","rise":"19:20","set":"07:45"},{"d":17,"date":"9月28日","alt":7.5,"az":87.9,"illum":94,"E":207.2,"phase":"亏凸月","rise":"20:10","set":"08:35"},{"d":18,"date":"9月29日","alt":0.8,"az":77.7,"illum":89,"E":219.4,"phase":"亏凸月","rise":"21:00","set":"09:25"},{"d":19,"date":"9月30日","alt":-5.9,"az":67.5,"illum":81,"E":231.6,"phase":"亏凸月","rise":"21:50","set":"10:15"},{"d":20,"date":"10月1日","alt":-12.4,"az":57.0,"illum":72,"E":243.8,"phase":"亏凸月","rise":"22:40","set":"11:05"},{"d":21,"date":"10月2日","alt":-18.5,"az":46.0,"illum":62,"E":256.0,"phase":"亏凸月","rise":"23:30","set":"11:55"},{"d":22,"date":"10月3日","alt":-23.9,"az":34.3,"illum":52,"E":268.2,"phase":"下弦月","rise":"00:20","set":"12:45"},{"d":23,"date":"10月4日","alt":-28.3,"az":21.7,"illum":41,"E":280.4,"phase":"残月（渐亏）","rise":"01:10","set":"13:35"},{"d":24,"date":"10月5日","alt":-31.5,"az":8.1,"illum":31,"E":292.6,"phase":"残月（渐亏）","rise":"02:00","set":"14:25"},{"d":25,"date":"10月6日","alt":-33.2,"az":353.8,"illum":22,"E":304.8,"phase":"残月（渐亏）","rise":"02:50","set":"15:15"},{"d":26,"date":"10月7日","alt":-33.2,"az":339.2,"illum":13,"E":316.9,"phase":"残月（渐亏）","rise":"03:40","set":"16:05"},{"d":27,"date":"10月8日","alt":-31.6,"az":324.9,"illum":7,"E":329.1,"phase":"残月（渐亏）","rise":"04:30","set":"16:55"},{"d":28,"date":"10月9日","alt":-28.4,"az":311.3,"illum":3,"E":341.3,"phase":"残月（渐亏）","rise":"05:20","set":"17:45"},{"d":29,"date":"10月10日","alt":-23.9,"az":298.6,"illum":0,"E":353.5,"phase":"新月","rise":"06:10","set":"18:35"}];
var NS='http://www.w3.org/2000/svg';
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function moonD(E){
  var waxing=E<180, a=waxing?E:360-E;
  var rx=Math.abs(Math.cos(a*Math.PI/180)).toFixed(3);
  var gibbous=a>90;
  var limb=waxing?1:0, term=(gibbous===waxing)?1:0;
  return 'M0,-1 A1,1 0 0 '+limb+' 0,1 A'+rx+',1 0 0 '+term+' 0,-1 Z';
}
function moonIcon(E,r){
  var g=el('g',{});
  el('circle',{r:r,fill:'var(--dark)',stroke:'#3a466e','stroke-width':0.6},g);
  if(E>1&&E<359) el('path',{d:moonD(E),fill:'var(--moon)',transform:'scale('+r+')'},g);
  return g;
}
function px(az){return 180+(az-180)*1.1}
function py(alt){return 160-alt*2.2}
function dirName(az){if(az>=67.5&&az<112.5)return '东';if(az>=112.5&&az<157.5)return '东南';if(az>=157.5&&az<202.5)return '南';if(az>=202.5&&az<247.5)return '西南';if(az>=247.5&&az<292.5)return '西';if(az>=292.5||az<22.5)return '西北';if(az>=22.5&&az<67.5)return '东北';return '北'}

var sky=document.getElementById('sky');
// 星星
for(var i=0;i<70;i++){
  var sx2=Math.random()*360, sy2=Math.random()*150;
  el('circle',{cx:sx2.toFixed(1),cy:sy2.toFixed(1),r:(Math.random()*0.9+0.4).toFixed(2),
     fill:'#aab4d8',opacity:(Math.random()*0.5+0.25).toFixed(2)},sky);
}
[40,20].forEach(function(a){
  el('line',{x1:40,x2:320,y1:py(a),y2:py(a),stroke:'#2c3a63','stroke-width':0.6,'stroke-dasharray':'3 4'},sky);
  var t=el('text',{x:8,y:py(a)+3,'font-size':9,fill:'#54608c'},sky);t.textContent='+'+a+'°';
});
el('line',{x1:40,x2:320,y1:160,y2:160,stroke:'#3a466e','stroke-width':1.2},sky);
el('line',{x1:40,x2:40,y1:60,y2:160,stroke:'#2c3a63','stroke-width':0.6},sky);
el('line',{x1:320,x2:320,y1:60,y2:160,stroke:'#2c3a63','stroke-width':0.6},sky);
var hz=el('text',{x:318,y:174,'font-size':9,fill:'#54608c'},sky);hz.textContent='地平线';
[['东',90],['南',180],['西',270]].forEach(function(c){
  var t=el('text',{x:px(c[1]),y:178,'font-size':12,fill:'#8a94b8','text-anchor':'middle'},sky);t.textContent=c[0];
});
// 太阳（20:00 已落到地平线下）
el('circle',{cx:px(285),cy:py(-16),r:6,fill:'rgba(232,176,75,.3)',stroke:'var(--gold)','stroke-width':1},sky);
var st=el('text',{x:px(285),y:py(-16)+18,'font-size':9,fill:'#8a94b8','text-anchor':'middle'},sky);st.textContent='太阳(地平线下)';
// 一个月轨迹 + 每日小点
var pts=MOON_DATA.map(function(m){return px(m.az)+','+py(m.alt)}).join(' ');
el('polyline',{points:pts,fill:'none',stroke:'#3a466e','stroke-width':1,'stroke-dasharray':'2 3'},sky);
MOON_DATA.forEach(function(m){el('circle',{cx:px(m.az),cy:py(m.alt),r:2.2,fill:'#4a567e'},sky)});
// 当日月亮与标签
var selG=el('g',{},sky);
var selLabel=el('text',{'font-size':10,'text-anchor':'middle',fill:'var(--txt)','font-weight':600},sky);

function render(i){
  var m=MOON_DATA[i];
  document.getElementById('dateLabel').textContent=m.date;
  while(selG.firstChild)selG.removeChild(selG.firstChild);
  var x=px(m.az),y=py(m.alt),up=m.alt>0;
  var ic=moonIcon(m.E,14);
  ic.setAttribute('transform','translate('+x+','+y+')'+(up?'':' opacity="0.45"'));
  selG.appendChild(ic);
  selLabel.setAttribute('x',x);selLabel.setAttribute('y',y-22);
  selLabel.textContent=up?('高度'+m.alt.toFixed(0)+'° · '+dirName(m.az)+'方'):'在地平线下';
  selLabel.setAttribute('fill',up?'var(--txt)':'#54608c');
  var vis=up?'✓ 可见':'不可见';
  var stats=[['月相',m.phase],['照亮比例',m.illum+'%'],['20:00 状态',vis],
             ['高度角',m.alt.toFixed(0)+'°'],['方位角',dirName(m.az)+' '+m.az.toFixed(0)+'°'],
             ['月升',m.rise],['月落',m.set],['距新月',m.d+' 天']];
  document.getElementById('stats').innerHTML=stats.map(function(s){
    return '<div class="stat"><div class="k">'+s[0]+'</div><div class="v">'+s[1]+'</div></div>';
  }).join('');
  var strip=document.getElementById('strip');
  strip.innerHTML='';
  MOON_DATA.forEach(function(mm,j){
    var b=document.createElement('button');
    if(j===i)b.className='on';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','-1.2 -1.2 2.4 2.4');svg.setAttribute('width','26');svg.setAttribute('height','26');
    svg.appendChild(moonIcon(mm.E,1));
    b.appendChild(svg);
    b.onclick=function(){setDay(j)};
    strip.appendChild(b);
  });
}
var sl=document.getElementById('sl'),timer=null;
function setDay(i){sl.value=i;render(i)}
sl.oninput=function(){render(+sl.value)};
var pb=document.getElementById('play');
pb.onclick=function(){
  if(timer){clearInterval(timer);timer=null;pb.textContent='▶ 连播';return}
  pb.textContent='⏸ 暂停';
  timer=setInterval(function(){setDay((+sl.value+1)%30)},600);
};
render(17); // 默认选中今天 9 月 28 日
</script>
</body>
</html>
